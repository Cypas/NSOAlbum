[package]
name = "squid_album_core"
version = "0.2.16"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
fs2 = "=0.4.3"
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
hex = "0.4"
rand = "0.8"
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "functions"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "=3.27.0"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
mtp-rs = "=0.33.0"
futures = "0.3"
bytes = "1"

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
