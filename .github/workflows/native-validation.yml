name: Reusable platform validation

on:
  workflow_call:
    inputs:
      ref:
        description: Exact immutable commit SHA to validate
        type: string
        required: true
      release:
        description: Also produce the Windows Inno installer (does not publish a Release)
        type: boolean
        default: false
      release_tag:
        description: Stable tag checked by the release version gate
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu Rust and Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Assert exact validation commit
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" != "" && [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/ci-dependencies
        with:
          platform: ubuntu-x64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Rust formatting, Clippy, and unit tests
        working-directory: rust_core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"
      - name: Dart analysis and full Flutter test suite
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          dart analyze
          flutter test --machine --no-pub > "$RUNNER_TEMP/flutter-tests.jsonl"
      - name: Summarize actual test totals
        if: always()
        shell: pwsh
        run: |
          $rust = Join-Path $env:RUNNER_TEMP 'rust-tests.log'
          $flutter = Join-Path $env:RUNNER_TEMP 'flutter-tests.jsonl'
          ./flutter_app/tool/ci_native.ps1 -RustLog $rust -FlutterMachineLog $flutter -ReportsDirectory native-reports
      - name: Upload sanitized validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-ubuntu
          if-no-files-found: ignore
          retention-days: 14
          path: |
            native-reports/test-counts.json
            ${{ runner.temp }}/flutter-tests.jsonl
            ${{ runner.temp }}/rust-tests.log

  secrets:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Assert exact scan commit
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native:
    name: Native gates ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            architecture: X64
            target: x86_64-pc-windows-msvc
            mac_arch: ""
          - platform: macos-arm64
            runner: macos-15
            architecture: Arm64
            target: aarch64-apple-darwin
            mac_arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            architecture: X64
            target: x86_64-apple-darwin
            mac_arch: x64
    uses: ./.github/workflows/native-platform.yml
    with:
      ref: ${{ inputs.ref }}
      release: ${{ inputs.release }}
      release_tag: ${{ inputs.release_tag }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      target: ${{ matrix.target }}
      mac_arch: ${{ matrix.mac_arch }}

  android:
    name: Android ARM64 build and package checks
    uses: ./.github/workflows/android-validation.yml
    with:
      ref: ${{ inputs.ref }}
      release_tag: ${{ inputs.release_tag }}
      sign_release: ${{ inputs.release }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ inputs.release && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ inputs.release && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ inputs.release && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ inputs.release && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}

  complete:
    name: Require all platforms and shared checks
    if: always()
    needs:
      - ubuntu
      - secrets
      - native
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete validation
        shell: bash
        env:
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          test "$UBUNTU_RESULT" = success
          test "$SECRETS_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$ANDROID_RESULT" = success
