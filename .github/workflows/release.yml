name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Resolve and validate the exact release tag
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve release reference
        id: version
        shell: pwsh
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:MANUAL_TAG } else { $env:PUSH_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must use vMAJOR.MINOR.PATCH.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - name: Pin the release tag commit
        id: commit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $sha = git rev-parse HEAD
          $tagSha = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $sha -ne $tagSha) { throw 'Release tag does not resolve to the checkout commit.' }
          if ($env:EVENT_NAME -eq 'push' -and $sha -ne $env:EVENT_SHA) { throw 'Release tag moved after the push event.' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Verify source and release tag versions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./flutter_app/tool/validate_release_version.ps1 -Version $env:RELEASE_VERSION -ReleaseTag $env:RELEASE_TAG

  platforms:
    name: Validate, build, and smoke all native platforms
    needs: validate
    uses: ./.github/workflows/native-validation.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      release: true
      release_tag: ${{ needs.validate.outputs.tag }}

  publish:
    name: Publish only after every platform gate succeeds
    needs:
      - validate
      - platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Refuse publication if the release tag moved
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: native-*
          merge-multiple: true
      - name: Collect exactly the installer and two architecture DMGs
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir upload
          for name in \
            "NSOAlbum-${VERSION}-Setup.exe" \
            "NSOAlbum-macOS-arm64-${VERSION}.dmg" \
            "NSOAlbum-macOS-x64-${VERSION}.dmg"; do
            mapfile -t matches < <(find release-assets -type f -name "$name")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp "${matches[0]}" "upload/$name"
          done
          (cd upload && sha256sum ./* > SHA256SUMS.txt)
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.sha }}
          name: NSOAlbum ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          body: |
            macOS packages are provided separately for Apple Silicon (arm64) and Intel (x64). They are ad-hoc signed for integrity, not Developer ID signed or notarized. Gatekeeper may require manually allowing the app on first launch.

            All three native builds must pass Rust checks, Dart analysis, the complete Flutter test suite, and isolated packaged-app smoke tests before publication. macOS DMGs are also mounted and smoke-tested.

            Windows updates verify the Inno Setup installer using the SHA-256 digest exposed by the official GitHub Releases API. SHA256SUMS.txt is included for manual verification.
          files: |
            upload/*-Setup.exe
            upload/*.dmg
            upload/SHA256SUMS.txt
