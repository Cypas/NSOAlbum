name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Optional exact commit or branch to validate (defaults to selected ref)
        required: false
        type: string
      package_installer:
        description: Build test installer and DMGs as artifacts only (no tag or Release)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Pin the requested validation commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  platforms:
    name: All platform gates
    needs: resolve
    uses: ./.github/workflows/native-validation.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      release: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.package_installer == true) }}
  validation:
    name: Required validation
    if: always()
    needs:
      - resolve
      - platforms
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation gate
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PLATFORM_RESULT: ${{ needs.platforms.result }}
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = success
          test "$PLATFORM_RESULT" = success
