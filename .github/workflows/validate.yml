name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - codex/public-release
  workflow_dispatch:
    inputs:
      ref:
        description: Optional exact commit or branch to validate (defaults to selected ref)
        required: false
        type: string
      package_installer:
        description: Build test installer and DMGs as artifacts only (no tag or Release)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Pin the requested validation commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  platforms:
    name: All platform gates
    needs: resolve
    uses: ./.github/workflows/native-validation.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.package_installer == true }}
